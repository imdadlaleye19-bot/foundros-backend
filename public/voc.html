<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survéo Customer Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="shell">
  <div class="topnav">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-name">Survéo</div></div>
    <div class="topnav-right">
      <div class="tabs">
        <a href="dashboard.html" class="tab">Pulse</a>
        <a href="update.html" class="tab">Update</a>
        <a href="history.html" class="tab">Historique</a>
        <a href="finance.html" class="tab">Finance</a>
        <a href="legal.html" class="tab">Legal</a>
        <a href="market.html" class="tab">Veille</a>
        <a href="voc.html" class="tab active">Clients</a>
      </div>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </div>
  <div id="saveIndicator" class="save-indicator">✓ Enregistré</div>
  <div class="container" style="max-width:640px">
    <div class="module-note">Centralise tous les retours clients ici (emails, appels, avis), puis lance une analyse IA pour repérer les tendances.</div>
    <div class="section-title" style="margin-top:0"><span class="n">+</span>Ajouter un retour client</div>
    <div class="field-group"><label class="field-label">Source</label>
      <select id="fbSource"><option>Email</option><option>Appel</option><option>Réseaux sociaux</option><option>Avis en ligne</option><option>Autre</option></select></div>
    <div class="field-group"><label class="field-label">Contenu</label><textarea id="fbText" placeholder="ex: le client trouve l'onboarding trop long"></textarea></div>
    <button class="primary" onclick="addFeedback()">Ajouter</button>
    <button class="secondary" style="margin-top:14px" id="analyzeFeedbackBtn" onclick="analyzeFeedback()">✦ Analyser les tendances avec l'IA</button>
    <div id="feedbackAnalysis"></div>
    <div class="section-title"><span class="n">≡</span>Retours enregistrés</div>
    <div id="feedbackList"><div class="chart-empty">Chargement...</div></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let feedback_ = [];

async function load(){
  const user = await requireAuth();
  if(!user) return;
  try{ const { feedback } = await apiCall('/api/feedback'); feedback_ = feedback; render(); }catch(e){ console.error(e); }
}

async function addFeedback(){
  const source = document.getElementById('fbSource').value;
  const text = document.getElementById('fbText').value.trim();
  if(!text){ alert("Le contenu du retour est requis."); return; }
  try{
    await apiCall('/api/feedback', { method:'POST', body: JSON.stringify({source, text}) });
    document.getElementById('fbText').value = '';
    showSaveIndicator();
    await load();
  }catch(e){ alert('Erreur : '+e.message); }
}
async function deleteFeedbackEntry(id){
  if(!confirm('Supprimer ce retour ?')) return;
  try{ await apiCall('/api/feedback/'+id, {method:'DELETE'}); await load(); }catch(e){ alert('Erreur : '+e.message); }
}

async function analyzeFeedback(){
  if(feedback_.length < 2){ alert("Ajoute au moins 2 retours clients pour une analyse pertinente."); return; }
  const btn = document.getElementById('analyzeFeedbackBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner accent"></span> Analyse en cours...';
  try{
    const feedbackText = feedback_.map((f,i)=>`${i+1}. [${f.source}] ${f.text}`).join('\n');
    const prompt = 'Voici une liste de retours clients bruts pour une entreprise :\n\n' + feedbackText + '\n\nAnalyse ces retours et rédige en français un court résumé structuré (5-6 phrases max) : les 2-3 thèmes qui reviennent le plus souvent, la tendance générale, et une suggestion d\u2019action concrète. Pas de titres, pas de puces, juste un texte fluide.';
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: 400, messages:[{role:"user", content: prompt}] })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    document.getElementById('feedbackAnalysis').innerHTML = `<div class="analysis-box"><h4>✦ Tendances détectées</h4><p>${textBlock.text}</p></div>`;
  }catch(e){
    document.getElementById('feedbackAnalysis').innerHTML = `<div class="analysis-box"><h4>Erreur</h4><p>L'analyse a échoué, réessaie.</p></div>`;
  }
  btn.disabled = false; btn.textContent = '✦ Analyser les tendances avec l\u2019IA';
}

function render(){
  const listEl = document.getElementById('feedbackList');
  if(feedback_.length===0){ listEl.innerHTML='<div class="chart-empty">Aucun retour enregistré.</div>'; return; }
  listEl.innerHTML = feedback_.map(f=>`
    <div class="list-card">
      <div class="list-card-top">
        <div><div class="list-card-title">${f.source}</div><div class="list-card-sub">${new Date(f.ts).toLocaleDateString('fr-FR')}</div></div>
        <button class="list-card-del" onclick="deleteFeedbackEntry('${f.id}')">Supprimer</button>
      </div>
      <div class="list-card-body">${f.text}</div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
