<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survéo — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brand-mark" style="width:36px;height:36px"><img src="assets/logo-symbol.png" alt="Survéo"></div>
      <div class="auth-title">Survéo</div>
    </div>

    <div id="loginForm">
      <div class="auth-sub">Surveillez. Comprenez. Décidez.</div>
      <div class="auth-error" id="loginError"></div>
      <div class="field-group"><label class="field-label">Email</label><input type="email" id="loginEmail" placeholder="toi@entreprise.com"></div>
      <div class="field-group"><label class="field-label">Mot de passe</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="primary" id="loginBtn" onclick="doLogin()">Se connecter</button>
      <div class="auth-switch">Pas encore de compte ? <a onclick="showRegister()">Créer un compte</a></div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="auth-sub">Crée ton compte entreprise</div>
      <div class="auth-error" id="registerError"></div>
      <div class="field-group"><label class="field-label">Nom de l'entreprise</label><input type="text" id="regCompany" placeholder="ex: Lamia Tech"></div>
      <div class="field-group"><label class="field-label">Email</label><input type="email" id="regEmail" placeholder="toi@entreprise.com"></div>
      <div class="field-group"><label class="field-label">Mot de passe</label><input type="password" id="regPassword" placeholder="8 caractères minimum"></div>
      <button class="primary" id="registerBtn" onclick="doRegister()">Créer mon compte</button>
      <div class="auth-switch">Déjà un compte ? <a onclick="showLogin()">Se connecter</a></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
function showRegister(){ document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); }
function showLogin(){ document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.style.display = 'none';
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Connexion...';
  try{
    const data = await apiCall('/api/login', { method:'POST', body: JSON.stringify({email, password}) });
    setToken(data.token);
    window.location.href = 'dashboard.html';
  }catch(e){
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function doRegister(){
  const companyName = document.getElementById('regCompany').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const errEl = document.getElementById('registerError');
  const btn = document.getElementById('registerBtn');
  errEl.style.display = 'none';
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Création...';
  try{
    const data = await apiCall('/api/register', { method:'POST', body: JSON.stringify({email, password, companyName}) });
    setToken(data.token);
    window.location.href = 'dashboard.html';
  }catch(e){
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Créer mon compte';
  }
}

// Si déjà connecté, redirige direct vers le dashboard
if(getToken()){
  apiCall('/api/me').then(()=>{ window.location.href = 'dashboard.html'; }).catch(()=>{ clearToken(); });
}
</script>
</body>
</html>
