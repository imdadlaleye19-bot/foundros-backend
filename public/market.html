<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survéo Veille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="shell">
  <div class="topnav">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-name">Survéo</div></div>
    <div class="topnav-right">
      <div class="tabs">
        <a href="dashboard.html" class="tab">Pulse</a>
        <a href="update.html" class="tab">Update</a>
        <a href="history.html" class="tab">Historique</a>
        <a href="finance.html" class="tab">Finance</a>
        <a href="legal.html" class="tab">Legal</a>
        <a href="market.html" class="tab active">Veille</a>
        <a href="voc.html" class="tab">Clients</a>
      </div>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </div>
  <div id="saveIndicator" class="save-indicator">✓ Enregistré</div>
  <div class="container" style="max-width:640px">
    <div class="module-note">Journal de veille centralisé — tu ajoutes tes concurrents et notes ici au lieu de les avoir éparpillés dans des screenshots.</div>
    <div class="section-title" style="margin-top:0"><span class="n">+</span>Ajouter un concurrent à suivre</div>
    <div class="row2">
      <div class="field-group"><label class="field-label">Nom</label><input type="text" id="compName" placeholder="ex: ConcurrentX"></div>
      <div class="field-group"><label class="field-label">Site web</label><input type="text" id="compUrl" placeholder="https://..."></div>
    </div>
    <button class="primary" onclick="addCompetitor()">Ajouter</button>
    <div class="section-title"><span class="n">≡</span>Concurrents suivis</div>
    <div id="competitorList"><div class="chart-empty">Chargement...</div></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let competitors_ = [];

async function load(){
  const user = await requireAuth();
  if(!user) return;
  try{ const { competitors } = await apiCall('/api/competitors'); competitors_ = competitors; render(); }catch(e){ console.error(e); }
}

async function addCompetitor(){
  const name = document.getElementById('compName').value.trim();
  const url = document.getElementById('compUrl').value.trim();
  if(!name){ alert("Le nom du concurrent est requis."); return; }
  try{
    await apiCall('/api/competitors', { method:'POST', body: JSON.stringify({name, url}) });
    document.getElementById('compName').value=''; document.getElementById('compUrl').value='';
    showSaveIndicator();
    await load();
  }catch(e){ alert('Erreur : '+e.message); }
}
async function deleteCompetitor(id){
  if(!confirm('Supprimer ce concurrent et ses notes ?')) return;
  try{ await apiCall('/api/competitors/'+id, {method:'DELETE'}); await load(); }catch(e){ alert('Erreur : '+e.message); }
}

function render(){
  const listEl = document.getElementById('competitorList');
  if(competitors_.length===0){ listEl.innerHTML='<div class="chart-empty">Aucun concurrent suivi.</div>'; return; }
  listEl.innerHTML = competitors_.map(c=>`
    <div class="list-card competitor-item" id="comp-${c.id}">
      <div class="list-card-top" onclick="toggleCompetitor('${c.id}')">
        <div><div class="list-card-title">${c.name}</div><div class="list-card-sub">${c.url||'—'}</div></div>
        <button class="list-card-del" onclick="event.stopPropagation(); deleteCompetitor('${c.id}')">Supprimer</button>
      </div>
      <div class="notes-feed" id="notes-feed-${c.id}">
        <div class="row2"><input type="text" id="note-input-${c.id}" placeholder="ex: a baissé ses prix de 20%" style="grid-column:1/3"></div>
        <button class="ghost" style="margin-top:8px" onclick="addCompetitorNote('${c.id}')">Ajouter une observation</button>
        <div id="notes-list-${c.id}"></div>
      </div>
    </div>`).join('');
}
async function toggleCompetitor(id){
  const item = document.getElementById('comp-'+id);
  const wasOpen = item.classList.contains('open');
  item.classList.toggle('open');
  if(!wasOpen){
    try{
      const { notes } = await apiCall(`/api/competitors/${id}/notes`);
      document.getElementById('notes-list-'+id).innerHTML = notes.length
        ? notes.map(n=>`<div class="note-line"><div class="note-date">${new Date(n.ts).toLocaleDateString('fr-FR')}</div>${n.note}</div>`).join('')
        : '<div class="chart-empty" style="padding:10px 0">Aucune observation notée.</div>';
    }catch(e){ console.error(e); }
  }
}
async function addCompetitorNote(id){
  const input = document.getElementById('note-input-'+id);
  const note = input.value.trim();
  if(!note) return;
  try{
    await apiCall(`/api/competitors/${id}/notes`, { method:'POST', body: JSON.stringify({note}) });
    input.value = '';
    showSaveIndicator();
    const { notes } = await apiCall(`/api/competitors/${id}/notes`);
    document.getElementById('notes-list-'+id).innerHTML = notes.map(n=>`<div class="note-line"><div class="note-date">${new Date(n.ts).toLocaleDateString('fr-FR')}</div>${n.note}</div>`).join('');
  }catch(e){ alert('Erreur : '+e.message); }
}
load();
</script>
</body>
</html>
