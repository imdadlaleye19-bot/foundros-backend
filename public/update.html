<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survéo — Update investisseurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="shell">
  <div class="topnav">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-name">Survéo</div></div>
    <div class="topnav-right">
      <div class="tabs">
        <a href="dashboard.html" class="tab">Pulse</a>
        <a href="update.html" class="tab active">Update</a>
        <a href="history.html" class="tab">Historique</a>
        <a href="finance.html" class="tab">Finance</a>
        <a href="legal.html" class="tab">Legal</a>
        <a href="market.html" class="tab">Veille</a>
        <a href="voc.html" class="tab">Clients</a>
      </div>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </div>
  <div id="saveIndicator" class="save-indicator">✓ Enregistré</div>

  <div class="container" style="max-width:640px">
    <div class="section-title" style="margin-top:0"><span class="n">1</span>Tes indicateurs ce mois-ci</div>
    <div class="row2">
      <div class="field-group"><label class="field-label">ARR (€)</label><input type="number" class="mono" id="arr" placeholder="ex: 42000"></div>
      <div class="field-group"><label class="field-label">ARR mois dernier (€)</label><input type="number" class="mono" id="arrPrev" placeholder="ex: 37500"></div>
    </div>
    <div class="row2">
      <div class="field-group"><label class="field-label">Burn mensuel (€)</label><input type="number" class="mono" id="burn" placeholder="ex: 8200"></div>
      <div class="field-group"><label class="field-label">Burn mois dernier (€)</label><input type="number" class="mono" id="burnPrev" placeholder="ex: 8900"></div>
    </div>
    <div class="row2">
      <div class="field-group"><label class="field-label">Trésorerie disponible (€)</label><input type="number" class="mono" id="cash" placeholder="ex: 65000"></div>
      <div class="field-group"><label class="field-label">Clients actifs</label><input type="number" class="mono" id="clients" placeholder="ex: 14"></div>
    </div>

    <div class="section-title"><span class="n">2</span>Victoires du mois</div>
    <div class="field-group"><div class="field-hint">Note en vrac, la rédaction se fait automatiquement</div>
      <textarea id="wins" placeholder="ex: signé 2 nouveaux clients, lancé la v2..."></textarea></div>

    <div class="section-title"><span class="n">3</span>Difficultés / besoin d'aide</div>
    <div class="field-group"><textarea id="challenges" placeholder="ex: recrutement dev bloqué depuis 1 mois..."></textarea></div>

    <div class="ai-toggle">
      <div class="ai-toggle-left"><div class="ai-icon">✦</div><div class="ai-toggle-text"><b>Rédaction IA</b>Transforme tes notes en paragraphes soignés</div></div>
      <div class="switch on" id="aiSwitch" onclick="toggleAI()"><div class="switch-dot"></div></div>
    </div>

    <button class="primary" id="genBtn" onclick="generateUpdate()">Générer l'update investisseur</button>
    <div id="updatePreview"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let aiEnabled = true;
function toggleAI(){ aiEnabled = !aiEnabled; document.getElementById('aiSwitch').classList.toggle('on', aiEnabled); }

async function craftNarrative(wins, challenges){
  const prompt = "Tu es un rédacteur qui aide un fondateur à rédiger sa mise à jour mensuelle pour ses investisseurs.\n\nVictoires du mois : " + (wins || "aucune victoire notée") + "\nDifficultés / besoins d'aide : " + (challenges || "aucune difficulté notée") + "\n\nRédige en français deux courts paragraphes distincts (3-4 phrases max chacun), séparés par ###, destinés à des investisseurs : un sur les victoires (ton confiant), un sur les difficultés (ton honnête et direct). Aucun titre, aucune puce.";
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: 400, messages:[{role:"user", content: prompt}] })
  });
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('vide');
  const parts = textBlock.text.split('###').map(s=>s.trim()).filter(Boolean);
  return { winsText: parts[0], challengesText: parts[1] };
}
function fallbackFormat(raw, emptyMsg){
  if(!raw) return emptyMsg;
  return raw.split(/[.,\n]+/).map(s=>s.trim()).filter(Boolean).map(s=>'• '+s.charAt(0).toUpperCase()+s.slice(1)).join('\n');
}

async function generateUpdate(){
  const arr = parseFloat(document.getElementById('arr').value) || 0;
  const arrPrev = parseFloat(document.getElementById('arrPrev').value) || 0;
  const burn = parseFloat(document.getElementById('burn').value) || 0;
  const burnPrev = parseFloat(document.getElementById('burnPrev').value) || 0;
  const cash = parseFloat(document.getElementById('cash').value) || 0;
  const clients = parseFloat(document.getElementById('clients').value) || 0;
  const wins = document.getElementById('wins').value.trim();
  const challenges = document.getElementById('challenges').value.trim();
  if(!arr && !cash){ alert("Renseigne au moins l'ARR et la trésorerie."); return; }

  const genBtn = document.getElementById('genBtn');
  genBtn.disabled = true;
  genBtn.innerHTML = aiEnabled ? '<span class="spinner"></span> Rédaction en cours...' : 'Génération...';

  let winsText, challengesText, aiUsed = false;
  try{
    if(aiEnabled){ const r = await craftNarrative(wins, challenges); winsText=r.winsText; challengesText=r.challengesText; aiUsed=true; }
    else throw new Error('AI off');
  }catch(e){
    winsText = fallbackFormat(wins, 'Rien de renseigné ce mois-ci');
    challengesText = fallbackFormat(challenges, 'Aucun point bloquant signalé');
  }

  try{
    const { update } = await apiCall('/api/updates', {
      method:'POST',
      body: JSON.stringify({ arr, arrPrev, burn, burnPrev, cash, clients, wins, challenges, winsText, challengesText, aiUsed })
    });
    showSaveIndicator();
    const arrDelta = pctDelta(update.arr, update.arrPrev);
    const burnDelta = pctDelta(update.burn, update.burnPrev);
    const runway = update.burn > 0 ? (update.cash/update.burn) : null;
    document.getElementById('updatePreview').innerHTML = `
      <div class="update-doc">
        <div class="u-title-row"><div class="u-title">Update investisseurs</div>${update.aiUsed?'<span class="ai-chip">✦ Rédigé par IA</span>':''}</div>
        <div class="u-date">${monthLabel(update.ts)}</div>
        <div class="u-metrics">
          <div class="u-metric"><div class="mv">${fmtEuro(update.arr)}</div><div class="ml">ARR ${arrDelta!==null?(arrDelta>=0?'↑':'↓')+Math.abs(arrDelta).toFixed(0)+'%':''}</div></div>
          <div class="u-metric"><div class="mv">${fmtEuro(update.burn)}</div><div class="ml">Burn ${burnDelta!==null?(burnDelta<=0?'↓':'↑')+Math.abs(burnDelta).toFixed(0)+'%':''}</div></div>
          <div class="u-metric"><div class="mv">${runway!==null?runway.toFixed(1)+' mo':'—'}</div><div class="ml">Runway</div></div>
        </div>
        <div class="u-block"><h4>Victoires</h4><p>${update.winsText}</p></div>
        <div class="u-block"><h4>Défis & besoins</h4><p>${update.challengesText}</p></div>
      </div>`;
  }catch(e){ alert("Erreur lors de la sauvegarde : " + e.message); }

  genBtn.disabled = false;
  genBtn.textContent = "Générer l'update investisseur";
}

requireAuth();
</script>
</body>
</html>
